name: Deploy to cPanel Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cpanel
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Validate PHP syntax
        run: |
          find app config database/migrations scripts public \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate deployment secrets
        shell: bash
        run: |
          missing=()
          for name in CPANEL_HOST CPANEL_USERNAME CPANEL_DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required production secrets: ${missing[*]}"
            exit 1
          fi

          if [ -z "$CPANEL_PORT" ]; then
            echo "CPANEL_PORT=22" >> "$GITHUB_ENV"
          fi

      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_HOST_KEY: ${{ secrets.CPANEL_SSH_HOST_KEY }}
        run: |
          if [ -z "$CPANEL_SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing required production secret: CPANEL_SSH_PRIVATE_KEY"
            exit 1
          fi

          if [ -z "$CPANEL_SSH_HOST_KEY" ]; then
            echo "::error::Missing required production secret: CPANEL_SSH_HOST_KEY"
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$CPANEL_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare production directories
        run: |
          ssh -p "$CPANEL_PORT" "$CPANEL_USERNAME@$CPANEL_HOST" \
            "mkdir -p '$CPANEL_DEPLOY_PATH' \
              '$CPANEL_DEPLOY_PATH/storage/logs' \
              '$CPANEL_DEPLOY_PATH/storage/cache' \
              '$CPANEL_DEPLOY_PATH/storage/uploads' \
              '$CPANEL_DEPLOY_PATH/public/uploads'"

      - name: Deploy application
        run: |
          rsync -az --delete --delay-updates \
            -e "ssh -p $CPANEL_PORT" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/logs/' \
            --exclude='storage/cache/' \
            --exclude='storage/uploads/' \
            --exclude='public/uploads/' \
            ./ "$CPANEL_USERNAME@$CPANEL_HOST:$CPANEL_DEPLOY_PATH/"

      - name: Run production migrations
        run: |
          ssh -p "$CPANEL_PORT" "$CPANEL_USERNAME@$CPANEL_HOST" \
            "cd '$CPANEL_DEPLOY_PATH' \
              && php scripts/migrate.php \
              && chmod -R u+rwX storage public/uploads"

      - name: Verify production
        if: ${{ success() }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_URL is not configured; skipping HTTP verification."
            exit 0
          fi

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            --max-time 30 \
            "$PRODUCTION_URL" > /dev/null
          echo "Production health check passed: $PRODUCTION_URL"

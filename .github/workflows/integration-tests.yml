name: Integration Tests

on:
  push:
    branches: [ feature/phase-5-cms-admin-module, cms-dynamic-content-refactor ]
  pull_request:
    branches: [ feature/phase-5-cms-admin-module ]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: desnkygroup_test
      DB_USERNAME: desnkygroup
      DB_PASSWORD: test_password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: desnkygroup_test
          MYSQL_USER: desnkygroup
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist
      - name: Create test environment file
        run: cp .env.example .env
      - name: Run migrations
        run: php scripts/migrate.php
      - name: Seed minimal data
        run: php scripts/seed.php
      - name: Start PHP built-in server
        run: php -S 127.0.0.1:8000 -t public > /tmp/php-server.log 2>&1 &
      - name: Wait for server
        run: |
          for i in {1..15}; do
            if nc -z 127.0.0.1 8000; then echo 'server up' && exit 0; fi
            sleep 1
          done
          cat /tmp/php-server.log
          exit 1
      - name: Run integration tests
        run: vendor/bin/phpunit tests/Integration --colors=always
